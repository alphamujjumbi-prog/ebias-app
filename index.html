<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ebias App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Ebias Dashboard</h1>
  <p class="subtitle">CRT Bias • Previous Day High / Low Sweep</p>

  <div class="controls">
    <button id="refreshBtn">↻ Refresh</button>
    <span id="lastUpdated">Loading...</span>
  </div>

  <div id="pairs"></div>

  <p class="footer">
    Automatic CRT / PDH-PDL bias.<br>
    Bullish = swept PDL & closed in upper half • Bearish = swept PDH & closed in lower half.
  </p>

  <script src="script.js"></script>
</body>
</html>
